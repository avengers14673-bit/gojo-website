<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satoru Gojo | The Strongest</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #050816;
  color: white;
  overflow: hidden;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

#intro {
  background:
    radial-gradient(circle at center, #173b75 0%, #081126 45%, #02030a 100%);
}

.glow {
  position: absolute;
  width: 350px;
  height: 350px;
  background: #168cff;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.35;
}

.content {
  position: relative;
  z-index: 2;
}

h1 {
  font-size: clamp(45px, 10vw, 90px);
  letter-spacing: 5px;
  text-shadow: 0 0 25px #168cff;
}

.subtitle {
  margin-top: 10px;
  font-size: 20px;
  letter-spacing: 6px;
  color: #9edcff;
}

button {
  margin-top: 40px;
  padding: 15px 35px;
  border: 2px solid #5ecbff;
  border-radius: 30px;
  background: rgba(0, 120, 255, 0.15);
  color: white;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 0 25px #168cff;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.08);
  background: #168cff;
}

#main {
  display: none;
  background:
    radial-gradient(circle at 30% 40%, #193d76 0%, transparent 35%),
    radial-gradient(circle at 80% 60%, #35146b 0%, transparent 35%),
    #050816;
}

.card {
  width: min(90%, 500px);
  padding: 35px;
  border: 1px solid rgba(100,200,255,0.5);
  border-radius: 25px;
  background: rgba(10,20,45,0.7);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(0,150,255,0.25);
}

.card h2 {
  font-size: 42px;
  margin-bottom: 8px;
}

.role {
  color: #63caff;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.info {
  display: grid;
  gap: 12px;
  margin-top: 25px;
}

.info div {
  padding: 14px;
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
}

.energy {
  position: absolute;
  width: 700px;
  height: 700px;
  border: 2px solid rgba(70,180,255,0.15);
  border-radius: 50%;
  animation: spin 15s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.fade {
  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>

<!-- FIRST SCREEN -->
<section id="intro" class="screen">
  <div class="glow"></div>
  <div class="energy"></div>

  <div class="content fade">
    <h1>SATORU GOJO</h1>
    <div class="subtitle">THE STRONGEST</div>

    <button onclick="enterSite()">
      👆 TAP TO ENTER
    </button>
  </div>
</section>


<!-- MAIN SCREEN -->
<section id="main" class="screen">

  <div class="glow"></div>
  <div class="energy"></div>

  <div class="card fade">

    <h2>SATORU GOJO</h2>

    <div class="role">
      SPECIAL GRADE SORCERER
    </div>

    <p>
      Welcome to the world of the strongest.
    </p>

    <div class="info">
      <div>♾️ LIMITLESS</div>
      <div>👁️ SIX EYES</div>
      <div>🔵 BLUE • 🔴 RED • 🟣 HOLLOW PURPLE</div>
    </div>

    <button onclick="showMessage()">
      UNLEASH THE POWER ⚡
    </button>

  </div>
</section>


<script>

function enterSite() {

  document.getElementById("intro").style.display = "none";

  document.getElementById("main").style.display = "flex";
}

function showMessage() {

  alert("Throughout Heaven and Earth... I alone am the honored one. ⚡");

}

</script>

</body>
</html>
