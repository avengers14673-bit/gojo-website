<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Satoru Gojo | The Strongest</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #050816;
  color: white;
  overflow: hidden;
}

/* =========================
   COMMON SCREEN
========================= */

.screen {
  width: 100vw;
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  position: relative;
  overflow: hidden;
}

/* =========================
   INTRO SCREEN
========================= */

#intro {

  background:
    radial-gradient(
      circle at center,
      #173b75 0%,
      #081126 45%,
      #02030a 100%
    );
}

.glow {

  position: absolute;

  width: 350px;
  height: 350px;

  background: #168cff;

  border-radius: 50%;

  filter: blur(100px);

  opacity: 0.35;
}

.content {

  position: relative;

  z-index: 2;
}

h1 {

  font-size: clamp(45px, 10vw, 90px);

  letter-spacing: 5px;

  text-shadow:
    0 0 15px #168cff,
    0 0 35px #168cff;
}

.subtitle {

  margin-top: 10px;

  font-size: 20px;

  letter-spacing: 6px;

  color: #9edcff;
}

/* =========================
   BUTTON
========================= */

button {

  margin-top: 40px;

  padding: 15px 35px;

  border: 2px solid #5ecbff;

  border-radius: 30px;

  background: rgba(0,120,255,0.15);

  color: white;

  font-size: 17px;

  cursor: pointer;

  box-shadow:
    0 0 15px #168cff,
    0 0 30px rgba(22,140,255,0.5);

  transition: 0.3s;
}

button:hover {

  transform: scale(1.08);

  background: #168cff;

}

/* =========================
   ENERGY CIRCLE
========================= */

.energy {

  position: absolute;

  width: 700px;
  height: 700px;

  border: 2px solid rgba(70,180,255,0.15);

  border-radius: 50%;

  animation: spin 15s linear infinite;
}

@keyframes spin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}

/* =========================
   MAIN SCREEN
========================= */

#main {

  display: none;

  background:

    radial-gradient(
      circle at 30% 40%,
      #193d76 0%,
      transparent 35%
    ),

    radial-gradient(
      circle at 80% 60%,
      #35146b 0%,
      transparent 35%
    ),

    #050816;
}

/* =========================
   MAIN CARD
========================= */

.card {

  width: min(90%, 500px);

  padding: 35px;

  border: 1px solid rgba(100,200,255,0.5);

  border-radius: 25px;

  background: rgba(10,20,45,0.7);

  backdrop-filter: blur(10px);

  box-shadow:
    0 0 40px rgba(0,150,255,0.25);

  position: relative;

  z-index: 5;
}

.card h2 {

  font-size: 42px;

  margin-bottom: 8px;

}

.role {

  color: #63caff;

  letter-spacing: 3px;

  margin-bottom: 25px;
}

.info {

  display: grid;

  gap: 12px;

  margin-top: 25px;
}

.info div {

  padding: 14px;

  border-radius: 12px;

  background: rgba(255,255,255,0.06);

}

/* =========================
   FADE ANIMATION
========================= */

.fade {

  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {

  from {

    opacity: 0;

    transform: scale(0.9);

  }

  to {

    opacity: 1;

    transform: scale(1);

  }

}

/* =========================
   POWER EFFECT
========================= */

.power-mode {

  animation: powerFlash 3s ease;
}

@keyframes powerFlash {

  0% {

    filter: brightness(1);

  }

  20% {

    filter: brightness(1.5);

  }

  40% {

    filter: brightness(2);

  }

  60% {

    filter: brightness(1.4);

  }

  100% {

    filter: brightness(1);

  }

}

/* =========================
   DOMAIN EXPANSION
========================= */

#domain {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 100;

  justify-content: center;

  align-items: center;

  text-align: center;

  background:

    radial-gradient(
      circle,
      #ffffff 0%,
      #b8e9ff 10%,
      #226cff 35%,
      #09002b 75%,
      #000000 100%
    );

  animation: domainIn 0.8s ease;
}

.domain-content {

  position: relative;

  z-index: 2;

}

.domain-title {

  font-size: clamp(35px, 8vw, 75px);

  letter-spacing: 8px;

  color: white;

  text-shadow:

    0 0 10px white,
    0 0 25px #00aaff,
    0 0 50px #0066ff;

}

.domain-subtitle {

  margin-top: 15px;

  font-size: 18px;

  letter-spacing: 5px;

  color: #d9f5ff;

}

.domain-ring {

  position: absolute;

  width: 80vw;

  height: 80vw;

  max-width: 700px;

  max-height: 700px;

  border: 2px solid rgba(255,255,255,0.5);

  border-radius: 50%;

  box-shadow:

    0 0 30px #168cff,
    inset 0 0 30px #168cff;

  animation: domainSpin 8s linear infinite;

}

@keyframes domainIn {

  from {

    opacity: 0;

    transform: scale(1.5);

  }

  to {

    opacity: 1;

    transform: scale(1);

  }

}

@keyframes domainSpin {

  from {

    transform: rotate(0deg) scale(1);

  }

  to {

    transform: rotate(360deg) scale(1.1);

  }

}

</style>
</head>


<body>


<!-- =========================
     FIRST SCREEN
========================= -->

<section id="intro" class="screen">

  <div class="glow"></div>

  <div class="energy"></div>

  <div class="content fade">

    <h1>SATORU GOJO</h1>

    <div class="subtitle">
      THE STRONGEST
    </div>

    <button onclick="enterSite()">
      👆 TAP TO ENTER
    </button>

  </div>

</section>



<!-- =========================
     MAIN SCREEN
========================= -->

<section id="main" class="screen">

  <div class="glow"></div>

  <div class="energy"></div>

  <div class="card fade">

    <h2>SATORU GOJO</h2>

    <div class="role">
      SPECIAL GRADE SORCERER
    </div>

    <p>
      Welcome to the world of the strongest.
    </p>


    <div class="info">

      <div>
        ♾️ LIMITLESS
      </div>

      <div>
        👁️ SIX EYES
      </div>

      <div>
        🔵 BLUE • 🔴 RED • 🟣 HOLLOW PURPLE
      </div>

    </div>


    <button onclick="showDomain()">
      UNLEASH THE POWER ⚡
    </button>

  </div>

</section>



<!-- =========================
     DOMAIN SCREEN
========================= -->

<section id="domain">

  <div class="domain-ring"></div>

  <div class="domain-content">

    <div class="domain-title">
      UNLIMITED VOID
    </div>

    <div class="domain-subtitle">
      DOMAIN EXPANSION
    </div>

  </div>

</section>



<script>


/* =========================
   ENTER WEBSITE
========================= */

function enterSite() {

  document.getElementById("intro").style.display = "none";

  document.getElementById("main").style.display = "flex";

}


/* =========================
   DOMAIN EXPANSION
========================= */

function showDomain() {

  document.body.classList.add("power-mode");

  document.getElementById("domain").style.display = "flex";


  setTimeout(function() {

    document.getElementById("domain").style.display = "none";

    document.body.classList.remove("power-mode");

  }, 5000);

}

</script>


</body>
</html>
