<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOJO — Limitless</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:white;
}

.scene{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#142a65 0%,#070d24 30%,#02030a 72%);
}

/* ================= ENERGY ================= */

.energy{
  position:absolute;
  inset:-40%;
  background:
    conic-gradient(
      from 0deg,
      transparent,
      rgba(0,170,255,.15),
      transparent,
      rgba(80,120,255,.2),
      transparent
    );
  animation:spin 8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.ring{
  position:absolute;
  left:50%;
  top:48%;
  width:360px;
  height:360px;
  transform:translate(-50%,-50%);
  border:2px solid rgba(85,190,255,.55);
  border-radius:50%;
  box-shadow:
    0 0 25px #168cff,
    inset 0 0 30px rgba(30,130,255,.4);
  animation:
    ringPulse 1.5s ease-in-out infinite,
    ringRotate 7s linear infinite;
}

.ring:nth-child(2){
  width:500px;
  height:500px;
  border-color:rgba(130,90,255,.25);
  animation-duration:2s,11s;
}

@keyframes ringPulse{
  0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.92)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
}

@keyframes ringRotate{
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

/* ================= SPEED LINES ================= */

.speed{
  position:absolute;
  width:3px;
  height:120px;
  background:linear-gradient(transparent,#5bc7ff,white,transparent);
  opacity:.7;
  animation:fall linear infinite;
}

@keyframes fall{
  from{
    transform:translateY(-150px) rotate(18deg);
    opacity:0;
  }
  15%{opacity:1}
  to{
    transform:translateY(120vh) rotate(18deg);
    opacity:0;
  }
}

/* ================= PARTICLES ================= */

.particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#8de7ff;
  box-shadow:0 0 12px #18aaff;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0) scale(.5);opacity:.3}
  50%{transform:translateY(-70px) scale(1.5);opacity:1}
}

/* ================= GOJO ================= */

.gojo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-45%) scale(.75);
  width:min(390px,78vw);
  height:520px;
  opacity:0;
  animation:
    gojoEnter 1.3s cubic-bezier(.17,.84,.44,1) forwards,
    gojoFloat 3s ease-in-out 1.3s infinite;
}

@keyframes gojoEnter{
  0%{
    opacity:0;
    transform:translate(-50%,-30%) scale(.25) rotate(-4deg);
    filter:blur(20px);
  }
  65%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08) rotate(1deg);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-45%) scale(1);
  }
}

@keyframes gojoFloat{
  0%,100%{margin-top:0}
  50%{margin-top:-10px}
}

/* Hair */

.hair{
  position:absolute;
  left:50%;
  top:20px;
  transform:translateX(-50%);
  width:260px;
  height:180px;
  background:
    linear-gradient(135deg,#ffffff,#ccecff 45%,#7799c9);
  clip-path:polygon(
    50% 0%,
    58% 18%,
    70% 5%,
    69% 28%,
    87% 13%,
    80% 38%,
    100% 32%,
    84% 53%,
    98% 64%,
    76% 63%,
    82% 91%,
    62% 72%,
    55% 100%,
    47% 75%,
    34% 95%,
    35% 68%,
    12% 82%,
    24% 58%,
    0% 58%,
    20% 40%,
    8% 25%,
    32% 30%,
    30% 8%,
    43% 20%
  );
  filter:drop-shadow(0 0 14px rgba(120,200,255,.7));
}

/* Face */

.face{
  position:absolute;
  left:50%;
  top:120px;
  transform:translateX(-50%);
  width:185px;
  height:250px;
  border-radius:45% 45% 48% 48%;
  background:
    linear-gradient(120deg,#f4fbff,#bcd3e8 70%,#7c9bb8);
  box-shadow:
    0 15px 35px rgba(0,0,0,.6),
    inset -12px -5px 20px rgba(60,100,140,.3);
}

/* eyes */

.eye{
  position:absolute;
  top:95px;
  width:42px;
  height:15px;
  background:#111b38;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 0 15px #4fcaff;
}

.eye.left{left:35px}
.eye.right{right:35px}

.eye::after{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  left:15px;
  top:1px;
  border-radius:50%;
  background:#8eeaff;
  box-shadow:
    0 0 8px #00bfff,
    0 0 20px #008cff;
  animation:eyeGlow 1s infinite alternate;
}

@keyframes eyeGlow{
  from{transform:scale(.8)}
  to{transform:scale(1.35)}
}

/* blindfold */

.blindfold{
  position:absolute;
  left:50%;
  top:187px;
  transform:translateX(-50%);
  width:230px;
  height:58px;
  background:
    linear-gradient(90deg,#05070e,#111827,#05070e);
  border-radius:45%;
  box-shadow:
    0 0 20px rgba(0,150,255,.4),
    inset 0 0 15px rgba(100,150,255,.15);
}

.blindfold::before{
  content:"";
  position:absolute;
  width:70px;
  height:100%;
  left:25px;
  background:linear-gradient(90deg,transparent,rgba(60,180,255,.4),transparent);
  animation:scan 1.4s linear infinite;
}

@keyframes scan{
  from{transform:translateX(-30px)}
  to{transform:translateX(170px)}
}

/* coat */

.coat{
  position:absolute;
  left:50%;
  top:330px;
  transform:translateX(-50%);
  width:320px;
  height:210px;
  background:
    linear-gradient(110deg,#070a12,#161d2c 48%,#03050b);
  clip-path:polygon(
    30% 0,
    70% 0,
    82% 12%,
    100% 100%,
    57% 86%,
    50% 100%,
    43% 86%,
    0 100%,
    18% 12%
  );
  box-shadow:0 0 25px rgba(0,100,255,.3);
}

.collar{
  position:absolute;
  left:50%;
  top:320px;
  transform:translateX(-50%);
  width:130px;
  height:120px;
  background:#111827;
  clip-path:polygon(0 0,50% 100%,100% 0);
}

/* ================= TEXT ================= */

.title{
  position:absolute;
  left:50%;
  bottom:65px;
  transform:translateX(-50%);
  text-align:center;
  z-index:10;
}

.title h1{
  font-size:clamp(42px,10vw,90px);
  letter-spacing:14px;
  font-weight:900;
  font-style:italic;
  color:white;
  text-shadow:
    0 0 5px white,
    0 0 15px #16aaff,
    0 0 35px #006eff;
  animation:titlePulse 1.2s infinite alternate;
}

.title p{
  margin-top:5px;
  letter-spacing:7px;
  font-size:12px;
  color:#8edfff;
}

@keyframes titlePulse{
  from{transform:scale(1)}
  to{transform:scale(1.04)}
}

/* ================= FLASH ================= */

.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  animation:flash 2.4s 1.1s;
}

@keyframes flash{
  0%,65%,100%{opacity:0}
  67%{opacity:.8}
  69%{opacity:0}
}

/* ================= BUTTON ================= */

.enter{
  position:absolute;
  left:50%;
  top:25px;
  transform:translateX(-50%);
  z-index:20;
  padding:13px 28px;
  border:1px solid rgba(100,210,255,.7);
  border-radius:30px;
  background:rgba(3,15,35,.65);
  color:white;
  letter-spacing:4px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,170,255,.3);
  transition:.25s;
}

.enter:hover{
  transform:translateX(-50%) scale(1.08);
  box-shadow:
    0 0 20px #00aaff,
    0 0 50px rgba(0,120,255,.6);
}

/* ================= ATTACK MODE ================= */

.attack{
  animation:attack .7s ease;
}

@keyframes attack{
  0%{transform:translate(-50%,-45%) scale(1)}
  30%{transform:translate(-50%,-45%) scale(1.2)}
  45%{transform:translate(-50%,-45%) scale(.9)}
  70%{transform:translate(-50%,-45%) scale(1.08)}
  100%{transform:translate(-50%,-45%) scale(1)}
}

.shockwave{
  position:absolute;
  left:50%;
  top:48%;
  width:50px;
  height:50px;
  border:5px solid #5de0ff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  opacity:0;
  pointer-events:none;
}

.shockwave.fire{
  animation:shock .8s ease-out;
}

@keyframes shock{
  0%{
    width:40px;
    height:40px;
    opacity:1;
    border-width:8px;
  }
  100%{
    width:900px;
    height:900px;
    opacity:0;
    border-width:1px;
  }
}

/* mobile */

@media(max-width:600px){
  .gojo{
    transform:translate(-50%,-45%) scale(.82);
  }

  .title{
    bottom:35px;
  }

  .title h1{
    letter-spacing:8px;
  }

  .ring{
    width:270px;
    height:270px;
  }
}
</style>
</head>

<body>

<div class="scene" id="scene">

  <div class="energy"></div>

  <div class="ring"></div>
  <div class="ring"></div>

  <button class="enter" id="attackBtn">
    LIMITLESS
  </button>

  <div class="gojo" id="gojo">

    <div class="hair"></div>

    <div class="face">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>

    <div class="blindfold"></div>

    <div class="collar"></div>
    <div class="coat"></div>

  </div>

  <div class="shockwave" id="shockwave"></div>

  <div class="flash"></div>

  <div class="title">
    <h1>GOJO</h1>
    <p>THE STRONGEST</p>
  </div>

</div>

<script>

const scene = document.getElementById("scene");
const gojo = document.getElementById("gojo");
const button = document.getElementById("attackBtn");
const shockwave = document.getElementById("shockwave");

/* SPEED LINES */

for(let i=0;i<34;i++){

  const line=document.createElement("div");
  line.className="speed";

  line.style.left=Math.random()*100+"%";
  line.style.top=(-Math.random()*100)+"px";

  line.style.height=(60+Math.random()*140)+"px";

  line.style.animationDuration=
    (0.7+Math.random()*1.5)+"s";

  line.style.animationDelay=
    (Math.random()*2)+"s";

  scene.appendChild(line);
}

/* PARTICLES */

for(let i=0;i<55;i++){

  const p=document.createElement("div");
  p.className="particle";

  p.style.left=Math.random()*100+"%";
  p.style.top=Math.random()*100+"%";

  p.style.animationDuration=
    (1.5+Math.random()*3)+"s";

  p.style.animationDelay=
    Math.random()*2+"s";

  scene.appendChild(p);
}

/* ATTACK */

button.addEventListener("click",()=>{

  gojo.classList.remove("attack");
  shockwave.classList.remove("fire");

  void gojo.offsetWidth;
  void shockwave.offsetWidth;

  gojo.classList.add("attack");
  shockwave.classList.add("fire");

  button.textContent="∞  LIMITLESS  ∞";

  setTimeout(()=>{
    button.textContent="LIMITLESS";
  },900);

});

/* tap anywhere = energy burst */

scene.addEventListener("click",(e)=>{

  if(e.target===button) return;

  const burst=document.createElement("div");

  burst.style.position="absolute";
  burst.style.left=e.clientX+"px";
  burst.style.top=e.clientY+"px";
  burst.style.width="20px";
  burst.style.height="20px";
  burst.style.border="3px solid #7cecff";
  burst.style.borderRadius="50%";
  burst.style.transform="translate(-50%,-50%)";
  burst.style.pointerEvents="none";
  burst.style.boxShadow="0 0 20px #00aaff";

  scene.appendChild(burst);

  burst.animate([
    {
      width:"20px",
      height:"20px",
      opacity:1
    },
    {
      width:"350px",
      height:"350px",
      opacity:0
    }
  ],{
    duration:700,
    easing:"cubic-bezier(.1,.8,.2,1)"
  });

  setTimeout(()=>burst.remove(),750);
});

</script>

</body>
</html>
