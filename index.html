<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Anime Card</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#050510;
  color:white;
}

/* ENTER SCREEN */
#enterScreen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:
    radial-gradient(circle at center,#25204f 0%,#0b0920 45%,#030308 100%);
}

#enterScreen h1{
  font-size:clamp(32px,8vw,65px);
  letter-spacing:5px;
  text-shadow:0 0 20px #9b7cff;
  margin-bottom:35px;
}

.enterBtn{
  border:2px solid #fff;
  background:transparent;
  color:#fff;
  padding:16px 45px;
  border-radius:50px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px #795cff;
  transition:.3s;
}

.enterBtn:hover{
  transform:scale(1.1);
  background:#fff;
  color:#111;
}

/* MAIN */
#main{
  height:100vh;
  display:none;
  justify-content:center;
  align-items:center;
  position:relative;
  background:
    radial-gradient(circle at 50% 40%,#30265e 0%,#100d25 38%,#030308 80%);
}

/* stars */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.2;transform:scale(.7)}
  to{opacity:1;transform:scale(1.5)}
}

/* CARD */
.card{
  position:relative;
  width:min(90vw,430px);
  min-height:570px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:28px;
  padding:35px 25px;
  text-align:center;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  box-shadow:0 0 60px rgba(126,91,255,.35);
  animation:cardIn 1s ease forwards;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:scale(.7) translateY(80px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

/* CARTOON */
.character{
  width:190px;
  height:190px;
  margin:0 auto 20px;
  position:relative;
  animation:characterFloat 2.5s ease-in-out infinite;
}

@keyframes characterFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-15px) rotate(2deg)}
}

/* head */
.head{
  position:absolute;
  width:125px;
  height:125px;
  left:32px;
  top:15px;
  border-radius:50%;
  background:#ffd7b3;
  border:4px solid #17121f;
  z-index:3;
}

/* hair */
.hair{
  position:absolute;
  width:135px;
  height:75px;
  left:27px;
  top:5px;
  background:#161122;
  border-radius:65% 65% 35% 35%;
  z-index:4;
}

.hair:after{
  content:"";
  position:absolute;
  width:45px;
  height:60px;
  left:45px;
  top:25px;
  background:#161122;
  clip-path:polygon(50% 0,100% 100%,0 70%);
}

/* eyes */
.eye{
  position:absolute;
  width:17px;
  height:23px;
  background:#161122;
  border-radius:50%;
  top:68px;
  z-index:6;
}

.eye.left{left:58px}
.eye.right{right:58px}

.eye:after{
  content:"";
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  top:4px;
  left:4px;
}

/* smile */
.mouth{
  position:absolute;
  width:35px;
  height:17px;
  border-bottom:4px solid #17121f;
  border-radius:50%;
  left:45px;
  top:102px;
  z-index:6;
}

/* body */
.body{
  position:absolute;
  width:120px;
  height:75px;
  left:35px;
  top:125px;
  background:#6655e8;
  border:4px solid #17121f;
  border-radius:35px 35px 20px 20px;
  z-index:2;
}

/* arms */
.arm{
  position:absolute;
  width:32px;
  height:65px;
  background:#ffd7b3;
  border:4px solid #17121f;
  border-radius:25px;
  top:130px;
  z-index:1;
}

.arm.left{
  left:8px;
  transform:rotate(25deg);
}

.arm.right{
  right:8px;
  transform:rotate(-25deg);
}

/* TEXT */
.small{
  font-size:14px;
  letter-spacing:4px;
  opacity:.7;
  margin-bottom:10px;
}

.name{
  font-size:clamp(30px,8vw,45px);
  font-weight:900;
  margin-bottom:10px;
  text-shadow:0 0 15px #a68cff;
}

.josh{
  display:inline-block;
  font-size:42px;
  font-weight:900;
  letter-spacing:5px;
  animation:josh 1.3s ease-in-out infinite;
  text-shadow:
    0 0 8px #fff,
    0 0 20px #9d7cff,
    0 0 40px #694cff;
}

@keyframes josh{
  0%,100%{
    transform:scale(1) rotate(0);
  }
  20%{
    transform:scale(1.15) rotate(-4deg);
  }
  40%{
    transform:scale(.95) rotate(4deg);
  }
  60%{
    transform:scale(1.12) rotate(-2deg);
  }
  80%{
    transform:scale(1) rotate(0);
  }
}

/* particles */
.particle{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:white;
  pointer-events:none;
  animation:explode 1s ease-out forwards;
}

@keyframes explode{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(var(--x),var(--y)) scale(0);
  }
}

.footer{
  margin-top:25px;
  font-size:12px;
  opacity:.5;
  letter-spacing:2px;
}
</style>
</head>

<body>

<!-- ENTER -->
<div id="enterScreen">
  <h1>TAP TO ENTER</h1>
  <button class="enterBtn" onclick="enter()">ENTER ✦</button>
</div>

<!-- MAIN -->
<div id="main">

  <!-- stars -->
  <div class="star" style="left:10%;top:15%"></div>
  <div class="star" style="left:22%;top:75%"></div>
  <div class="star" style="left:80%;top:20%"></div>
  <div class="star" style="left:90%;top:70%"></div>
  <div class="star" style="left:65%;top:10%"></div>
  <div class="star" style="left:35%;top:25%"></div>

  <div class="card" onclick="joshEffect(event)">

    <div class="character">

      <div class="hair"></div>

      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="body"></div>

    </div>

    <div class="small">WELCOME TO MY WORLD</div>

    <div class="name">YOUR NAME</div>

    <div class="josh">JOSH 🔥</div>

    <div class="footer">
      TAP ANYWHERE ON THE CARD
    </div>

  </div>

</div>

<script>

function enter(){

  document.getElementById("enterScreen").style.display="none";

  const main=document.getElementById("main");
  main.style.display="flex";

  burst(
    window.innerWidth/2,
    window.innerHeight/2,
    35
  );
}

function joshEffect(e){

  burst(e.clientX,e.clientY,25);

  const text=document.querySelector(".josh");

  text.animate(
    [
      {transform:"scale(1) rotate(0deg)"},
      {transform:"scale(1.5) rotate(-8deg)"},
      {transform:"scale(.8) rotate(8deg)"},
      {transform:"scale(1.2) rotate(-3deg)"},
      {transform:"scale(1) rotate(0deg)"}
    ],
    {
      duration:700,
      easing:"cubic-bezier(.2,.8,.2,1)"
    }
  );
}

function burst(x,y,count){

  for(let i=0;i<count;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=x+"px";
    p.style.top=y+"px";

    const angle=Math.random()*Math.PI*2;
    const distance=60+Math.random()*150;

    p.style.setProperty(
      "--x",
      Math.cos(angle)*distance+"px"
    );

    p.style.setProperty(
      "--y",
      Math.sin(angle)*distance+"px"
    );

    document.body.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },1000);
  }
}

</script>

</body>
</html>
