<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOSH — Anime Intro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#070707;
  color:#fff;
}

/* =========================
   INTRO
========================= */

.intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle,#242424 0%,#090909 45%,#000 100%);
  transition:1s;
}

.intro.hide{
  opacity:0;
  pointer-events:none;
  transform:scale(1.2);
}

.introBox{
  text-align:center;
}

.introBox p{
  font-size:13px;
  letter-spacing:7px;
  color:#aaa;
  margin-bottom:25px;
}

.start{
  position:relative;
  padding:18px 55px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#050505;
  font-size:18px;
  font-weight:900;
  letter-spacing:3px;
  cursor:pointer;
  box-shadow:0 0 35px rgba(255,255,255,.3);
  transition:.3s;
}

.start:hover{
  transform:scale(1.08);
}

/* =========================
   MAIN WORLD
========================= */

.world{
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(135deg,#050505,#151515 50%,#030303);
}

/* moving light */
.world:before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  background:rgba(255,255,255,.04);
  filter:blur(70px);
  animation:lightMove 6s ease-in-out infinite alternate;
}

@keyframes lightMove{
  from{
    transform:translate(-180px,-80px);
  }
  to{
    transform:translate(180px,100px);
  }
}

/* =========================
   CHARACTER STAGE
========================= */

.stage{
  position:relative;
  width:min(92vw,480px);
  height:min(90vh,650px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:2;
}

/* ground */
.ground{
  position:absolute;
  bottom:95px;
  width:260px;
  height:35px;
  border-radius:50%;
  background:#000;
  box-shadow:0 0 35px rgba(255,255,255,.18);
}

/* =========================
   NEW CARTOON
========================= */

.hero{
  position:relative;
  width:230px;
  height:300px;
  animation:heroFloat 3s ease-in-out infinite;
}

@keyframes heroFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-13px);
  }
}

/* hair back */
.hairBack{
  position:absolute;
  width:190px;
  height:155px;
  left:20px;
  top:15px;
  background:#111;
  border-radius:55% 55% 35% 35%;
  transform:rotate(-4deg);
}

/* face */
.face{
  position:absolute;
  width:145px;
  height:155px;
  left:42px;
  top:45px;
  background:#f1b98f;
  border:5px solid #090909;
  border-radius:48% 48% 45% 45%;
  z-index:3;
}

/* hair front */
.hairFront{
  position:absolute;
  width:160px;
  height:90px;
  left:35px;
  top:30px;
  background:#0b0b0b;
  z-index:5;
  clip-path:polygon(
    0 0,100% 0,92% 55%,
    78% 35%,68% 82%,
    55% 38%,42% 88%,
    30% 42%,18% 72%,0 55%
  );
}

/* eyes */
.eye{
  position:absolute;
  width:25px;
  height:32px;
  top:92px;
  background:#050505;
  border-radius:50%;
  z-index:7;
}

.eye.one{
  left:70px;
}

.eye.two{
  left:125px;
}

.eye:after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  top:5px;
  left:5px;
  border-radius:50%;
  background:white;
}

/* eyebrows */
.brow{
  position:absolute;
  width:35px;
  height:7px;
  background:#090909;
  top:78px;
  z-index:8;
  border-radius:10px;
}

.brow.one{
  left:65px;
  transform:rotate(-8deg);
}

.brow.two{
  left:120px;
  transform:rotate(8deg);
}

/* mouth */
.mouth{
  position:absolute;
  width:48px;
  height:23px;
  left:91px;
  top:145px;
  border-bottom:6px solid #111;
  border-radius:0 0 50% 50%;
  z-index:8;
}

/* neck */
.neck{
  position:absolute;
  width:50px;
  height:45px;
  left:90px;
  top:185px;
  background:#d99f77;
  border:5px solid #090909;
  z-index:1;
}

/* shirt */
.shirt{
  position:absolute;
  width:165px;
  height:100px;
  left:32px;
  top:205px;
  background:#e5e5e5;
  border:5px solid #090909;
  border-radius:45px 45px 20px 20px;
  z-index:2;
}

/* shirt design */
.shirt:after{
  content:"J";
  position:absolute;
  left:61px;
  top:10px;
  font-size:65px;
  font-weight:900;
  color:#111;
}

/* arms */
.arm{
  position:absolute;
  width:45px;
  height:100px;
  top:205px;
  background:#f1b98f;
  border:5px solid #090909;
  border-radius:30px;
  z-index:1;
}

.arm.one{
  left:5px;
  transform:rotate(18deg);
}

.arm.two{
  right:5px;
  transform:rotate(-18deg);
}

/* =========================
   NAME
========================= */

.tag{
  margin-top:10px;
  text-align:center;
  position:relative;
  z-index:10;
}

.tag small{
  display:block;
  font-size:11px;
  letter-spacing:6px;
  color:#888;
  margin-bottom:9px;
}

.name{
  font-size:clamp(38px,11vw,65px);
  font-weight:1000;
  letter-spacing:8px;
  line-height:1;
}

.name span{
  display:inline-block;
  animation:letterJump 1.8s infinite;
}

.name span:nth-child(2){animation-delay:.08s}
.name span:nth-child(3){animation-delay:.16s}
.name span:nth-child(4){animation-delay:.24s}

@keyframes letterJump{
  0%,75%,100%{
    transform:translateY(0);
  }
  82%{
    transform:translateY(-15px) rotate(-3deg);
  }
  88%{
    transform:translateY(3px) rotate(3deg);
  }
}

/* =========================
   JOSH BLAST
========================= */

.josh{
  margin-top:18px;
  font-size:clamp(38px,10vw,58px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:5px;
  opacity:0;
  transform:scale(.2) rotate(-20deg);
}

.josh.show{
  animation:joshBlast .9s cubic-bezier(.12,.8,.2,1) forwards;
}

@keyframes joshBlast{
  0%{
    opacity:0;
    transform:scale(.2) rotate(-20deg);
  }

  45%{
    opacity:1;
    transform:scale(1.35) rotate(5deg);
  }

  70%{
    transform:scale(.88) rotate(-2deg);
  }

  100%{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}

/* =========================
   SPEED LINES
========================= */

.line{
  position:absolute;
  width:180px;
  height:4px;
  background:#fff;
  opacity:0;
  transform:translateX(-400px);
}

.line:nth-child(1){
  top:25%;
  left:0;
}

.line:nth-child(2){
  top:40%;
  right:0;
}

.line:nth-child(3){
  top:65%;
  left:0;
}

.line.go{
  animation:speed .8s ease-out forwards;
}

@keyframes speed{
  0%{
    opacity:0;
    transform:translateX(-400px);
  }
  25%{
    opacity:.7;
  }
  100%{
    opacity:0;
    transform:translateX(500px);
  }
}

/* =========================
   TAP
========================= */

.tap{
  position:absolute;
  bottom:30px;
  font-size:10px;
  letter-spacing:4px;
  color:#666;
}

/* mobile */
@media(max-height:650px){
  .hero{
    transform:scale(.78);
    margin-bottom:-35px;
  }

  .name{
    font-size:38px;
  }

  .josh{
    font-size:35px;
  }
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="introBox">
    <p>READY?</p>
    <button class="start" onclick="startShow()">TAP TO ENTER</button>
  </div>
</div>

<!-- MAIN -->
<main class="world">

  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>

  <section class="stage">

    <div class="hero">

      <div class="hairBack"></div>

      <div class="face"></div>

      <div class="hairFront"></div>

      <div class="brow one"></div>
      <div class="brow two"></div>

      <div class="eye one"></div>
      <div class="eye two"></div>

      <div class="mouth"></div>

      <div class="neck"></div>

      <div class="arm one"></div>
      <div class="arm two"></div>

      <div class="shirt"></div>

    </div>

    <div class="ground"></div>

    <div class="tag">
      <small>THIS IS</small>

      <div class="name">
        <span>J</span>
        <span>O</span>
        <span>S</span>
        <span>H</span>
      </div>

      <div class="josh" id="josh">
        JOSH 🔥
      </div>
    </div>

    <div class="tap">
      TAP THE SCREEN
    </div>

  </section>

</main>

<script>

let started=false;

function startShow(){

  if(started) return;
  started=true;

  const intro=document.getElementById("intro");

  intro.classList.add("hide");

  setTimeout(()=>{
    document.getElementById("josh").classList.add("show");

    document.querySelectorAll(".line")
      .forEach((line,i)=>{
        setTimeout(()=>{
          line.classList.add("go");
        },i*180);
      });

  },500);
}

/* Tap anywhere = JOSH effect */
document.querySelector(".world").addEventListener("click",function(){

  if(!started) return;

  const j=document.getElementById("josh");

  j.classList.remove("show");

  void j.offsetWidth;

  j.classList.add("show");

  document.querySelectorAll(".line").forEach(line=>{
    line.classList.remove("go");
    void line.offsetWidth;
    line.classList.add("go");
  });

});

</script>

</body>
</html>
