<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Satoru Gojo | The Strongest</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #02040b;
    color: white;
}

/* =========================
   INTRO SCREEN
========================= */

#intro {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #164d91 0%,
            #0b2148 35%,
            #030817 70%,
            #010208 100%
        );
}

/* Blue glowing orb */

.intro-glow {
    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: #168cff;

    filter: blur(100px);

    opacity: 0.35;

    animation: glowPulse 3s infinite alternate;
}

@keyframes glowPulse {

    from {
        transform: scale(0.8);
        opacity: 0.25;
    }

    to {
        transform: scale(1.2);
        opacity: 0.5;
    }

}

/* Rotating circles */

.energy-circle {
    position: absolute;

    width: 600px;
    height: 600px;

    border-radius: 50%;

    border: 1px solid rgba(100,200,255,0.25);

    box-shadow:
        0 0 30px rgba(40,160,255,0.15),
        inset 0 0 30px rgba(40,160,255,0.1);

    animation: rotateCircle 15s linear infinite;
}

.energy-circle::before {
    content: "";

    position: absolute;

    inset: 50px;

    border-radius: 50%;

    border: 1px solid rgba(100,200,255,0.2);
}

@keyframes rotateCircle {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

/* Intro content */

.intro-content {
    position: relative;
    z-index: 5;

    animation: introAppear 1.5s ease;
}

@keyframes introAppear {

    from {
        opacity: 0;
        transform: scale(0.8);
        filter: blur(10px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

}

.intro-content h1 {

    font-size: clamp(42px, 11vw, 85px);

    letter-spacing: 5px;

    text-shadow:
        0 0 10px #ffffff,
        0 0 25px #168cff,
        0 0 55px #168cff;

}

.intro-subtitle {

    margin-top: 12px;

    font-size: 18px;

    letter-spacing: 7px;

    color: #a9e5ff;

}

/* Enter button */

.enter-button {

    margin-top: 45px;

    padding: 16px 38px;

    border-radius: 40px;

    border: 2px solid #65d4ff;

    background: rgba(0,120,255,0.12);

    color: white;

    font-size: 16px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 15px #168cff,
        0 0 35px rgba(22,140,255,0.5);

    transition: 0.3s;
}

.enter-button:hover {

    transform: scale(1.08);

    background: rgba(22,140,255,0.5);

}

/* =========================
   MAIN SCREEN
========================= */

#main {

    display: none;

    width: 100vw;
    height: 100vh;

    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 25% 35%,
            #164f91 0%,
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 65%,
            #38146d 0%,
            transparent 35%
        ),

        #030713;
}

/* Main glow */

.main-glow {

    position: absolute;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: #168cff;

    filter: blur(110px);

    opacity: 0.25;

    animation: mainGlow 4s infinite alternate;
}

@keyframes mainGlow {

    from {
        transform: scale(0.8);
    }

    to {
        transform: scale(1.3);
    }

}

/* Main card */

.gojo-card {

    position: relative;

    z-index: 5;

    width: min(90%, 500px);

    padding: 35px 25px;

    text-align: center;

    border-radius: 28px;

    border: 1px solid rgba(100,210,255,0.45);

    background: rgba(5,15,35,0.75);

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 30px rgba(20,150,255,0.25),
        inset 0 0 30px rgba(100,200,255,0.04);

    animation: cardAppear 1.2s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

.gojo-card h2 {

    font-size: 42px;

    letter-spacing: 3px;

    text-shadow:
        0 0 15px #168cff;

}

.role {

    margin-top: 8px;

    color: #69d4ff;

    letter-spacing: 3px;

    font-size: 14px;

}

.description {

    margin-top: 22px;

    color: #d8e9ff;

    line-height: 1.6;

}

.abilities {

    margin-top: 25px;

    display: grid;

    gap: 10px;
}

.ability {

    padding: 14px;

    border-radius: 14px;

    background: rgba(255,255,255,0.06);

    border: 1px solid rgba(100,190,255,0.12);

    transition: 0.3s;
}

.ability:hover {

    transform: scale(1.03);

    background: rgba(30,130,255,0.15);

}

/* Power button */

.power-button {

    margin-top: 30px;

    padding: 15px 30px;

    border-radius: 35px;

    border: 2px solid #65d4ff;

    background: rgba(0,120,255,0.15);

    color: white;

    font-size: 15px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 15px #168cff,
        0 0 35px rgba(22,140,255,0.4);

    transition: 0.3s;
}

.power-button:hover {

    transform: scale(1.06);

}

/* =========================
   DOMAIN EXPANSION
========================= */

#domain {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #c8f3ff 7%,
            #5cc9ff 18%,
            #2467ff 38%,
            #17104d 65%,
            #020006 100%
        );

    animation: domainAppear 0.8s ease forwards;
}

/* Huge rotating rings */

#domain::before {

    content: "";

    position: absolute;

    width: 150vw;
    height: 150vw;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,0.45);

    box-shadow:
        0 0 35px #5edcff,
        inset 0 0 45px #168cff;

    animation: domainRotate 10s linear infinite;
}

#domain::after {

    content: "";

    position: absolute;

    width: 95vw;
    height: 95vw;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.35);

    box-shadow:
        0 0 25px #ffffff;

    animation:
        domainRotateReverse 7s linear infinite;

}

/* Domain text */

.domain-content {

    position: relative;

    z-index: 10;

    opacity: 0;

    transform: scale(0.4);

    animation:
        domainTextReveal
        1.5s
        0.4s
        cubic-bezier(.2,.8,.2,1)
        forwards;

}

.domain-subtitle {

    font-size: 16px;

    letter-spacing: 8px;

    color: #e9fbff;

    margin-bottom: 18px;

    text-shadow:
        0 0 15px #00baff;

}

.domain-title {

    font-size: clamp(38px, 10vw, 85px);

    font-weight: 900;

    letter-spacing: 5px;

    color: white;

    text-shadow:

        0 0 8px white,
        0 0 20px #a5efff,
        0 0 45px #168cff,
        0 0 80px #0066ff;

    animation:
        titlePulse
        2s
        2s
        infinite
        alternate;

}

/* Domain animations */

@keyframes domainAppear {

    from {

        opacity: 0;

        transform: scale(1.5);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}

@keyframes domainTextReveal {

    0% {

        opacity: 0;

        transform: scale(0.4) translateY(40px);

        filter: blur(20px);

    }

    60% {

        opacity: 1;

        transform: scale(1.08) translateY(0);

        filter: blur(0);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}

@keyframes titlePulse {

    from {

        transform: scale(1);

        text-shadow:
            0 0 8px white,
            0 0 20px #8eeaff,
            0 0 45px #168cff;

    }

    to {

        transform: scale(1.05);

        text-shadow:
            0 0 15px white,
            0 0 35px #8eeaff,
            0 0 70px #168cff,
            0 0 110px #0066ff;

    }

}

@keyframes domainRotate {

    from {

        transform: rotate(0deg) scale(1);

    }

    to {

        transform: rotate(360deg) scale(1.12);

    }

}

@keyframes domainRotateReverse {

    from {

        transform: rotate(360deg) scale(1);

    }

    to {

        transform: rotate(0deg) scale(1.1);

    }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .energy-circle {

        width: 430px;
        height: 430px;

    }

    .gojo-card {

        padding: 30px 20px;

    }

    .gojo-card h2 {

        font-size: 34px;

    }

    .domain-subtitle {

        font-size: 13px;

        letter-spacing: 5px;

    }

}

</style>
</head>


<body>


<!-- =================================
     INTRO
================================= -->

<section id="intro">

    <div class="intro-glow"></div>

    <div class="energy-circle"></div>

    <div class="intro-content">

        <h1>
            SATORU GOJO
        </h1>

        <div class="intro-subtitle">
            THE STRONGEST
        </div>

        <button
            class="enter-button"
            onclick="enterSite()">

            👆 TAP TO ENTER

        </button>

    </div>

</section>



<!-- =================================
     MAIN
================================= -->

<section id="main">

    <div class="main-glow"></div>

    <div class="energy-circle"></div>

    <div class="gojo-card">

        <h2>
            SATORU GOJO
        </h2>

        <div class="role">
            SPECIAL GRADE SORCERER
        </div>

        <p class="description">

            Welcome to the world of
            the strongest.

        </p>


        <div class="abilities">

            <div class="ability">
                ♾️ LIMITLESS
            </div>

            <div class="ability">
                👁️ SIX EYES
            </div>

            <div class="ability">
                🔵 BLUE • 🔴 RED • 🟣 HOLLOW PURPLE
            </div>

        </div>


        <button
            class="power-button"
            onclick="showDomain()">

            UNLEASH THE POWER ⚡

        </button>

    </div>

</section>



<!-- =================================
     DOMAIN EXPANSION
================================= -->

<section id="domain">

    <div class="domain-content">

        <div class="domain-subtitle">
            DOMAIN EXPANSION
        </div>

        <div class="domain-title">
            UNLIMITED VOID
        </div>

    </div>

</section>



<script>

/* =========================
   ENTER WEBSITE
========================= */

function enterSite() {

    document.getElementById("intro").style.display = "none";

    document.getElementById("main").style.display = "flex";

}


/* =========================
   DOMAIN EXPANSION
========================= */

function showDomain() {

    const domain =
        document.getElementById("domain");

    domain.style.display = "flex";

    setTimeout(function() {

        domain.style.display = "none";

    }, 5500);

}

</script>


</body>
</html>
