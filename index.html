<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JOSH — Anime Energy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}

#intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050505;
  transition:1s;
}

#intro.hide{
  opacity:0;
  transform:scale(1.5);
  pointer-events:none;
}

.enter{
  padding:18px 45px;
  border:2px solid white;
  background:transparent;
  color:white;
  font-size:18px;
  font-weight:900;
  letter-spacing:4px;
  cursor:pointer;
  box-shadow:0 0 25px white;
}

.scene{
  width:100%;
  height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#202020,#080808 48%,#000);
}

/* ENERGY AURA */

.aura{
  position:absolute;
  width:350px;
  height:500px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  filter:blur(35px);
  animation:aura 1.2s infinite alternate;
}

@keyframes aura{
  from{transform:scale(.85);opacity:.4}
  to{transform:scale(1.15);opacity:.9}
}

/* SPEED LINES */

.speed{
  position:absolute;
  width:300px;
  height:3px;
  background:white;
  opacity:0;
}

.s1{top:18%;left:-300px}
.s2{top:32%;right:-300px}
.s3{top:55%;left:-300px}
.s4{top:72%;right:-300px}

.speed.go{
  animation:speed .7s linear forwards;
}

@keyframes speed{
  from{opacity:0;transform:translateX(0)}
  20%{opacity:.8}
  to{opacity:0;transform:translateX(800px)}
}

/* CHARACTER */

.character{
  position:relative;
  width:min(90vw,430px);
  z-index:5;
  transform:translateY(80px) scale(.7);
  opacity:0;
}

.character.entered{
  animation:characterIn 1.1s cubic-bezier(.15,.9,.2,1) forwards;
}

@keyframes characterIn{
  0%{
    opacity:0;
    transform:translateY(100px) scale(.5) rotate(-8deg);
  }
  60%{
    opacity:1;
    transform:translateY(-15px) scale(1.08) rotate(3deg);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1) rotate(0);
  }
}

svg{
  width:100%;
  height:auto;
  overflow:visible;
}

/* anime floating */

.character.entered svg{
  animation:float 2.5s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* JOSH */

.josh{
  position:absolute;
  left:50%;
  bottom:-5px;
  transform:translateX(-50%) scale(.1);
  opacity:0;
  font-size:clamp(45px,13vw,75px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:6px;
  text-shadow:
    3px 3px 0 #000,
    0 0 12px white,
    0 0 30px #aaa,
    0 0 60px white;
  white-space:nowrap;
}

.josh.show{
  animation:josh 1s cubic-bezier(.12,.8,.15,1) forwards;
}

@keyframes josh{
  0%{
    opacity:0;
    transform:translateX(-50%) scale(.1) rotate(-15deg);
  }
  35%{
    opacity:1;
    transform:translateX(-50%) scale(1.35) rotate(5deg);
  }
  55%{
    transform:translateX(-50%) scale(.85) rotate(-3deg);
  }
  75%{
    transform:translateX(-50%) scale(1.12) rotate(2deg);
  }
  100%{
    opacity:1;
    transform:translateX(-50%) scale(1) rotate(0);
  }
}

/* flash */

.flash{
  position:fixed;
  inset:0;
  z-index:15;
  background:white;
  opacity:0;
  pointer-events:none;
}

.flash.on{
  animation:flash .45s ease-out;
}

@keyframes flash{
  0%{opacity:.9}
  100%{opacity:0}
}

/* shake */

.shake{
  animation:shake .45s;
}

@keyframes shake{
  0%{transform:translate(0)}
  20%{transform:translate(-12px,5px)}
  40%{transform:translate(10px,-5px)}
  60%{transform:translate(-8px,3px)}
  80%{transform:translate(7px,-3px)}
  100%{transform:translate(0)}
}

.tap{
  position:absolute;
  bottom:20px;
  color:#777;
  font-size:10px;
  letter-spacing:5px;
}
</style>
</head>

<body>

<div id="intro">
  <button class="enter" onclick="startAnime()">
    TAP TO ENTER
  </button>
</div>

<div class="scene" id="scene">

  <div class="aura"></div>

  <div class="speed s1"></div>
  <div class="speed s2"></div>
  <div class="speed s3"></div>
  <div class="speed s4"></div>

  <div class="character" id="character">

    <!-- ANIME CHARACTER -->
    <svg viewBox="0 0 430 570">

      <!-- aura rays -->
      <g opacity=".35" stroke="white" stroke-width="5">
        <path d="M215 20 L190 100"/>
        <path d="M100 70 L145 125"/>
        <path d="M330 70 L285 125"/>
        <path d="M45 180 L120 200"/>
        <path d="M385 180 L310 200"/>
      </g>

      <!-- hair back -->
      <path
        d="M105 190
           Q70 100 145 55
           Q215 5 290 55
           Q365 100 325 190
           L295 145
           L275 190
           L245 145
           L220 195
           L190 145
           L150 190
           L135 145 Z"
        fill="#111"
        stroke="#fff"
        stroke-width="6"
      />

      <!-- neck -->
      <path
        d="M180 365 L180 430
           Q215 450 250 430
           L250 365"
        fill="#d99d78"
        stroke="#111"
        stroke-width="7"
      />

      <!-- face -->
      <path
        d="M120 175
           Q125 105 215 105
           Q305 105 310 175
           L295 330
           Q275 390 215 405
           Q155 390 135 330 Z"
        fill="#f0b48c"
        stroke="#111"
        stroke-width="7"
      />

      <!-- front spiky hair -->
      <path
        d="M110 180
           Q105 95 170 75
           L150 145
           L190 105
           L180 160
           L225 100
           L230 155
           L280 105
           L270 170
           L315 130
           Q325 190 300 205
           L275 170
           L250 205
           L220 160
           L185 205
           L155 170 Z"
        fill="#101010"
        stroke="#fff"
        stroke-width="6"
      />

      <!-- eyebrows -->
      <path
        d="M145 225 Q170 205 195 220"
        fill="none"
        stroke="#111"
        stroke-width="10"
        stroke-linecap="round"
      />

      <path
        d="M235 220 Q260 205 285 225"
        fill="none"
        stroke="#111"
        stroke-width="10"
        stroke-linecap="round"
      />

      <!-- anime eyes -->
      <path
        d="M140 245 Q170 215 200 245 Q170 285 140 245Z"
        fill="white"
        stroke="#111"
        stroke-width="7"
      />

      <path
        d="M230 245 Q260 215 290 245 Q260 285 230 245Z"
        fill="white"
        stroke="#111"
        stroke-width="7"
      />

      <!-- pupils -->
      <ellipse cx="171" cy="249" rx="11" ry="20" fill="#111"/>
      <ellipse cx="259" cy="249" rx="11" ry="20" fill="#111"/>

      <circle cx="167" cy="242" r="4" fill="white"/>
      <circle cx="255" cy="242" r="4" fill="white"/>

      <!-- nose -->
      <path
        d="M215 255 L203 300 L220 302"
        fill="none"
        stroke="#111"
        stroke-width="5"
        stroke-linecap="round"
      />

      <!-- confident smile -->
      <path
        d="M180 330 Q215 355 250 330"
        fill="none"
        stroke="#111"
        stroke-width="7"
        stroke-linecap="round"
      />

      <!-- body -->
      <path
        d="M125 430
           Q215 390 305 430
           L350 555
           L80 555 Z"
        fill="#181818"
        stroke="white"
        stroke-width="7"
      />

      <!-- jacket -->
      <path
        d="M125 430 L190 555"
        stroke="white"
        stroke-width="6"
      />

      <path
        d="M305 430 L240 555"
        stroke="white"
        stroke-width="6"
      />

      <!-- shirt symbol -->
      <text
        x="215"
        y="505"
        text-anchor="middle"
        font-size="60"
        font-weight="900"
        fill="white">
        J
      </text>

    </svg>

    <div class="josh" id="josh">JOSH 🔥</div>

  </div>

  <div class="tap">
    TAP THE SCREEN
  </div>

</div>

<div class="flash" id="flash"></div>

<script>

function startAnime(){

  document.getElementById("intro").classList.add("hide");

  const character=document.getElementById("character");

  setTimeout(()=>{
    character.classList.add("entered");

    document.querySelectorAll(".speed").forEach((line,i)=>{
      setTimeout(()=>{
        line.classList.add("go");
      },i*120);
    });

  },250);

  setTimeout(()=>{
    animeBlast();
  },1000);
}


function animeBlast(){

  const scene=document.getElementById("scene");
  const flash=document.getElementById("flash");
  const josh=document.getElementById("josh");

  flash.classList.add("on");
  scene.classList.add("shake");

  josh.classList.add("show");

  document.querySelectorAll(".speed").forEach(line=>{
    line.classList.remove("go");
    void line.offsetWidth;
    line.classList.add("go");
  });

  setTimeout(()=>{
    flash.classList.remove("on");
    scene.classList.remove("shake");
  },500);
}


/* tap again = energetic anime hit */

document.getElementById("scene").addEventListener("click",()=>{

  if(
    !document
      .getElementById("intro")
      .classList.contains("hide")
  ) return;

  const josh=document.getElementById("josh");

  josh.classList.remove("show");
  void josh.offsetWidth;
  josh.classList.add("show");

  animeBlast();
});

</script>

</body>
</html>
